name: Pascal Scanning Tool CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-jar
        path: target/scanner-desktop-client.jar

  build-windows:
    name: Build Windows Distribution
    runs-on: windows-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Create Windows distribution
      run: |
        mkdir -p dist
        copy target\scanner-desktop-client.jar dist\
        copy lib\jacob-1.21-x64.dll dist\
        copy lib\jacob.jar dist\
        echo Pascal Scanning Tool v1.0.0 > dist\README.txt
        echo Run: java -jar scanner-desktop-client.jar >> dist\README.txt
        echo. >> dist\README.txt
        echo To create a native installer, run: packaging\windows\package.bat >> dist\README.txt
        
    - name: Upload Windows distribution
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-windows
        path: dist/

  build-macos:
    name: Build macOS Distribution
    runs-on: macos-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Create macOS distribution
      run: |
        mkdir -p dist
        cp target/scanner-desktop-client.jar dist/
        echo "Pascal Scanning Tool v1.0.0" > dist/README.txt
        echo "Run: java -jar scanner-desktop-client.jar" >> dist/README.txt
        echo "" >> dist/README.txt
        echo "To create a native installer, run: chmod +x packaging/macos/package.sh && packaging/macos/package.sh" >> dist/README.txt
        
    - name: Upload macOS distribution
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-macos
        path: dist/

  build-linux:
    name: Build Linux Distribution
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Create Linux distribution
      run: |
        mkdir -p dist
        cp target/scanner-desktop-client.jar dist/
        echo "Pascal Scanning Tool v1.0.0" > dist/README.txt
        echo "Run: java -jar scanner-desktop-client.jar" >> dist/README.txt
        echo "" >> dist/README.txt
        echo "To create a native installer, run: chmod +x packaging/linux/package.sh && packaging/linux/package.sh" >> dist/README.txt
        
    - name: Upload Linux distribution
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-linux
        path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release archive
      run: |
        mkdir -p release
        cp pascal-scanning-tool-windows/* release/
        cp pascal-scanning-tool-macos/* release/
        cp pascal-scanning-tool-linux/* release/
        
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release/
        asset_name: pascal-scanning-tool-${{ github.event.release.tag_name }}
        asset_content_type: application/zip