name: Pascal Scanning Tool CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-jar
        path: target/scanner-desktop-client.jar

  build-windows:
    name: Build Windows Distribution
    runs-on: windows-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Debug - List files
      run: |
        Write-Host "=== Current directory contents ==="
        Get-ChildItem
        Write-Host "=== Target directory contents ==="
        if (Test-Path target) { Get-ChildItem target }
        Write-Host "=== Lib directory contents ==="
        if (Test-Path lib) { Get-ChildItem lib }
      
    - name: Create Windows distribution
      run: |
        Write-Host "=== Creating Windows distribution ==="
        if (-not (Test-Path dist)) { New-Item -ItemType Directory -Path dist }
        Write-Host "=== Checking for JAR file ==="
        if (Test-Path target\scanner-desktop-client.jar) {
          Write-Host "JAR file found, copying..."
          Copy-Item target\scanner-desktop-client.jar dist\
          Write-Host "JAR file copied successfully"
        } else {
          Write-Host "ERROR: scanner-desktop-client.jar not found in target directory"
          Write-Host "Target directory contents:"
          if (Test-Path target) { Get-ChildItem target }
          exit 1
        }
        Write-Host "=== Checking for JACOB libraries ==="
        if (Test-Path lib\jacob-1.21-x64.dll) {
          Write-Host "JACOB DLL found, copying..."
          Copy-Item lib\jacob-1.21-x64.dll dist\
        } else {
          Write-Host "WARNING: jacob-1.21-x64.dll not found in lib directory"
          Write-Host "Lib directory contents:"
          if (Test-Path lib) { Get-ChildItem lib }
        }
        if (Test-Path lib\jacob.jar) {
          Write-Host "JACOB JAR found, copying..."
          Copy-Item lib\jacob.jar dist\
        } else {
          Write-Host "WARNING: jacob.jar not found in lib directory"
        }
        Write-Host "=== Creating README ==="
        "Pascal Scanning Tool v1.0.0" | Out-File -FilePath dist\README.txt -Encoding ASCII
        "Run: java -jar scanner-desktop-client.jar" | Out-File -FilePath dist\README.txt -Append -Encoding ASCII
        "" | Out-File -FilePath dist\README.txt -Append -Encoding ASCII
        "To create a native installer, run: packaging\windows\package.bat" | Out-File -FilePath dist\README.txt -Append -Encoding ASCII
        Write-Host "=== Distribution created successfully ==="
        Get-ChildItem dist
        
    - name: Upload Windows distribution
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-windows
        path: dist/

  build-macos:
    name: Build macOS Distribution
    runs-on: macos-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Create macOS distribution
      run: |
        mkdir -p dist
        cp target/scanner-desktop-client.jar dist/
        echo "Pascal Scanning Tool v1.0.0" > dist/README.txt
        echo "Run: java -jar scanner-desktop-client.jar" >> dist/README.txt
        echo "" >> dist/README.txt
        echo "To create a native installer, run: chmod +x packaging/macos/package.sh && packaging/macos/package.sh" >> dist/README.txt
        
    - name: Upload macOS distribution
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-macos
        path: dist/

  build-linux:
    name: Build Linux Distribution
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Create Linux distribution
      run: |
        mkdir -p dist
        cp target/scanner-desktop-client.jar dist/
        echo "Pascal Scanning Tool v1.0.0" > dist/README.txt
        echo "Run: java -jar scanner-desktop-client.jar" >> dist/README.txt
        echo "" >> dist/README.txt
        echo "To create a native installer, run: chmod +x packaging/linux/package.sh && packaging/linux/package.sh" >> dist/README.txt
        
    - name: Upload Linux distribution
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-linux
        path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release archive
      run: |
        mkdir -p release
        cp pascal-scanning-tool-windows/* release/
        cp pascal-scanning-tool-macos/* release/
        cp pascal-scanning-tool-linux/* release/
        
    - name: Upload release assets (GitHub Release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release/
        asset_name: pascal-scanning-tool-${{ github.event.release.tag_name }}
        asset_content_type: application/zip
        
    - name: Upload artifacts (Manual/Push)
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: pascal-scanning-tool-release-${{ github.run_number }}
        path: release/